name: Guardia Verification

# Guardia gates deployment: deploy only runs if verify passes.
# Works on any platform — no platform-side configuration needed.
on:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify Privacy Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Guardia verification
        run: node .guardia/verify.js
        env:
          GUARDIA_API_KEY: ${{ secrets.GUARDIA_API_KEY }}
          GUARDIA_PROJECT_ID: ${{ secrets.GUARDIA_PROJECT_ID }}
          GUARDIA_API_URL: ${{ secrets.GUARDIA_API_URL }}

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
